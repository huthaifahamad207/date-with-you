<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pick Our Next Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<!-- ENTRY / TAP TO OPEN -->
<div id="entry-screen">
<div class="entry-inner">
<p class="entry-heart">💌</p>
<p class="entry-title">a little question</p>
<p class="entry-text">tap to open</p>
</div>
</div>
<script>
(function(){
var entry = document.getElementById('entry-screen');
if (!entry) return;
var opened = false;
function openNow(){
if (opened) return;
opened = true;
var s = document.getElementById('song');
if (s) {
s.muted = false;
s.volume = 1;
var p = s.play();
if (p && p.catch) p.catch(function(){});
}
entry.classList.add('hidden');
document.body.classList.remove('entry-locked');
// script.js (loaded at the bottom) owns the chase-and-cart opening story.
// On a slow connection it might not have run yet -- flag it as pending so
// script.js can kick it off itself the moment it's ready.
if (window.__runChase) { window.__runChase(); } else { window.__pendingChase = true; }
}
['pointerdown','mousedown','touchstart','touchend','click','keydown'].forEach(function(evt){
document.addEventListener(evt, openNow, { capture: true, passive: true });
entry.addEventListener(evt, openNow, { passive: true });
});
window.__entryOpenedEarly = function(){ return opened; };
})();
</script>

<!-- OPENING STORY: she runs, he chases, catches her, carts her off to the
     options. Pure photos + CSS transforms -- no sprite art needed. -->
<div id="story-intro" class="story-intro" hidden>
<p class="story-intro-caption" id="chase-caption-top">she's making a run for it&hellip;</p>
<div class="chase-stage" id="chase-stage">
<div class="chase-group" id="chase-group">
<div class="cart-shape chase-cart" id="chase-cart" aria-hidden="true">
<div class="cart-body"></div>
<div class="cart-wheel cart-wheel-a"></div>
<div class="cart-wheel cart-wheel-b"></div>
</div>
<div class="chase-person chase-boy" id="chase-boy"><img src="images/man.jpg" alt=""></div>
<div class="chase-person chase-girl" id="chase-girl"><img src="images/girl.jpg" alt=""></div>
<div class="chase-spark" aria-hidden="true">💥</div>
</div>
</div>
<p class="story-intro-caption story-intro-caption-bottom" id="chase-caption-bottom"></p>
</div>

<!-- ================= MAIN SITE ================= -->
<main id="site">

<div class="petals" aria-hidden="true"></div>

<audio id="song" preload="auto" loop playsinline>
<source src="song.mp3?v=1" type="audio/mpeg">
</audio>
<button id="music-toggle" type="button" aria-label="Play music">
<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
<path d="M9 18V5l12-2v13"/>
<circle cx="6" cy="18" r="3"/>
<circle cx="18" cy="16" r="3"/>
</svg>
</button>

<!-- HERO -->
<section class="hero">
<p class="eyebrow reveal">for you</p>
<h1 class="hero-title reveal">
Let's go on a date. <em>Your pick.</em>
</h1>
<p class="hero-sub reveal">tap whichever one sounds like you</p>
</section>

<!-- IDEAS -->
<section class="ideas">
<div class="ideas-inner">
<p class="eyebrow reveal">choose our next date</p>
<h2 class="ideas-title reveal">What sounds fun to you?</h2>

<!-- Persistent little illustration: she's still in the cart while the
     options wait around her. Static, no motion -- same two photos. -->
<div class="cart-illustration reveal" aria-hidden="true">
<div class="cart-shape cart-shape-mini">
<div class="cart-body"></div>
<div class="cart-wheel cart-wheel-a"></div>
<div class="cart-wheel cart-wheel-b"></div>
</div>
<div class="mini-person mini-boy"><img src="images/man.jpg" alt=""></div>
<div class="mini-person mini-girl"><img src="images/girl.jpg" alt=""></div>
</div>

<div class="card-grid reveal" id="card-grid">
<button class="idea-card" data-idea="Lunch / Dinner" data-emoji="🍽️">
<span class="idea-emoji">🍽️</span>
<span class="idea-name">Lunch / Dinner</span>
</button>
<button class="idea-card" data-idea="Movie" data-emoji="🎬">
<span class="idea-emoji">🎬</span>
<span class="idea-name">Movie</span>
</button>
<button class="idea-card" data-idea="Horseback Riding" data-emoji="🏇">
<span class="idea-emoji">🏇</span>
<span class="idea-name">Horseback Riding</span>
</button>
<button class="idea-card" data-idea="Coffee" data-emoji="☕">
<span class="idea-emoji">☕</span>
<span class="idea-name">Coffee</span>
</button>
<button class="idea-card" data-idea="Romantic Date" data-emoji="🌹">
<span class="idea-emoji">🌹</span>
<span class="idea-name">Romantic Date</span>
</button>
<button class="idea-card" data-idea="Games" data-emoji="🎮">
<span class="idea-emoji">🎮</span>
<span class="idea-name">Games</span>
</button>
<button class="idea-card" data-idea="Outdoor Activity" data-emoji="🌳">
<span class="idea-emoji">🌳</span>
<span class="idea-name">Outdoor Activity</span>
</button>
<button class="idea-card" data-idea="Trip / Travel" data-emoji="✈️">
<span class="idea-emoji">✈️</span>
<span class="idea-name">Trip / Travel</span>
</button>
<button class="idea-card" data-idea="Surprise" data-emoji="🎁">
<span class="idea-emoji">🎁</span>
<span class="idea-name">Surprise</span>
</button>
<button class="idea-card" data-idea="Other date ideas" data-emoji="❤️">
<span class="idea-emoji">❤️</span>
<span class="idea-name">Other date ideas</span>
</button>
</div>

<div class="decoy-row reveal">
<button id="btn-decoy" class="btn-decoy">none of these, surprise me</button>
</div>
</div>

<!-- Confirmation -->
<div id="celebration" hidden>
<div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
<div class="celebration-card">
<div class="celebration-couple">
<img src="images/man.jpg" alt="" class="celebration-photo celebration-photo-man">
<img src="images/girl.jpg" alt="" class="celebration-photo celebration-photo-girl">
</div>
<p class="script big">Perfect. It's a date.</p>
<p class="celebration-sub" id="celebration-choice"></p>
</div>
</div>
</section>

</main>

<script src="script.js?v=5"></script>
</body>
</html>
