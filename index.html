<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pick Our Next Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<!-- ENTRY / TAP TO OPEN -->
<div id="entry-screen">
<div class="entry-inner">
<p class="entry-heart">💌</p>
<p class="entry-title">a little question</p>
<p class="entry-text">tap to open</p>
</div>
</div>
<script>
(function(){
var entry = document.getElementById('entry-screen');
if (!entry) return;
var opened = false;
function openNow(){
if (opened) return;
opened = true;
var s = document.getElementById('song');
if (s) {
s.muted = false;
s.volume = 1;
var p = s.play();
if (p && p.catch) p.catch(function(){});
}
entry.classList.add('hidden');
document.body.classList.remove('entry-locked');
}
['pointerdown','mousedown','touchstart','touchend','click','keydown'].forEach(function(evt){
document.addEventListener(evt, openNow, { capture: true, passive: true });
entry.addEventListener(evt, openNow, { passive: true });
});
window.__entryOpenedEarly = function(){ return opened; };
})();
</script>

<!-- ================= MAIN SITE ================= -->
<main id="site">

<div class="petals" aria-hidden="true"></div>

<audio id="song" preload="auto" loop playsinline>
<source src="song.mp3?v=1" type="audio/mpeg">
</audio>
<button id="music-toggle" type="button" aria-label="Play music">
<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
<path d="M9 18V5l12-2v13"/>
<circle cx="6" cy="18" r="3"/>
<circle cx="18" cy="16" r="3"/>
</svg>
</button>

<!-- HERO -->
<section class="hero">
<p class="eyebrow reveal">for you</p>
<h1 class="hero-title reveal">
Let's go on a date. <em>Your pick.</em>
</h1>
<p class="hero-sub reveal">tap whichever one sounds like you</p>
</section>

<!-- IDEAS -->
<section class="ideas">
<div class="ideas-inner">
<p class="eyebrow reveal">choose our next date</p>
<h2 class="ideas-title reveal">What sounds fun to you?</h2>

<div class="card-grid reveal" id="card-grid">
<button class="idea-card" data-idea="Cook together &amp; bad music" data-emoji="🍝">
<span class="idea-emoji">🍝</span>
<span class="idea-name">Cook together, terrible playlist</span>
</button>
<button class="idea-card" data-idea="Stargazing with blankets" data-emoji="🌌">
<span class="idea-emoji">🌌</span>
<span class="idea-name">Stargazing, blankets, no plan</span>
</button>
<button class="idea-card" data-idea="Sunset walk &amp; ice cream" data-emoji="🌅">
<span class="idea-emoji">🌅</span>
<span class="idea-name">Sunset walk + ice cream</span>
</button>
<button class="idea-card" data-idea="Movie marathon blanket fort" data-emoji="🎬">
<span class="idea-emoji">🎬</span>
<span class="idea-name">Movie marathon, blanket fort</span>
</button>
<button class="idea-card" data-idea="Road trip, no destination" data-emoji="🚗">
<span class="idea-emoji">🚗</span>
<span class="idea-name">Road trip, no destination</span>
</button>
<button class="idea-card" data-idea="Dinner somewhere new" data-emoji="🍽️">
<span class="idea-emoji">🍽️</span>
<span class="idea-name">Dinner, somewhere new</span>
</button>
</div>

<div class="decoy-row reveal">
<button id="btn-decoy" class="btn-decoy">none of these, surprise me</button>
</div>
</div>

<!-- Shared "he runs to her" mini-story -- gets moved into whichever
     card she taps, so there's only ever one copy of the photos in the DOM. -->
<div id="story-scene" class="story-scene" hidden aria-hidden="true">
<div class="story-photo story-man"><img src="images/man.jpg" alt=""></div>
<div class="story-spark">💥</div>
<div class="story-photo story-girl"><img src="images/girl.jpg" alt=""></div>
<p class="story-caption" id="story-caption"></p>
</div>

<!-- Confirmation -->
<div id="celebration" hidden>
<div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
<div class="celebration-card">
<div class="celebration-couple">
<img src="images/man.jpg" alt="" class="celebration-photo celebration-photo-man">
<img src="images/girl.jpg" alt="" class="celebration-photo celebration-photo-girl">
</div>
<p class="script big">Perfect. It's a date.</p>
<p class="celebration-sub" id="celebration-choice"></p>
</div>
</div>
</section>

</main>

<script src="script.js?v=4"></script>
</body>
</html>
